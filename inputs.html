<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LedgerMap - Manage Inputs</title>

    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/inputs.css" />
</head>
<body>
    <a href="index.html" class="back-btn">&lt;- Back to Graph</a>
    <h2>Inputs</h2>

    <div class="top-bar">
        <label for="entryTypeSelect">Entry Type:</label>
        <select id="entryTypeSelect">
            <option value="recurring">Recurring</option>
            <option value="once">Once</option>
            <option value="loan">Loan</option>
        </select>
        <button id="addBtn" class="btn-primary">+ Add New Entry</button>

        <div style="margin-left: auto; display: flex; gap: 8px;">
            <button id="exportBtn">Export JSON</button>
            <button id="importBtn">Import JSON</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" />
        </div>
    </div>

    <div id="entriesContainer"></div>

    <br>
    <button id="saveBtn" class="btn-primary btn-save">Save All Inputs</button>

    <template id="template-entry-details">
        <details open class="entry-accordion">
            <summary>
                <span class="entry-type-badge"></span>
                <span class="summary-title"></span>
            </summary>
            <div class="entry-content-wrapper"></div>
        </details>
    </template>

    <template id="template-recurring">
        <div class="row">
            <input type="text" placeholder="Name" class="fieldName" oninput="updateSummary(this)" />
            <input type="number" placeholder="Value" class="fieldVal" />

            <div class="inline-group">
                <span class="inline-label">Every</span>
                <input type="number" class="fieldFreqNum w-50" value="1" min="1" />
                <select class="fieldFreqUnit w-90">
                    <option value="days">Days</option>
                    <option value="weeks">Weeks</option>
                    <option value="months" selected>Months</option>
                    <option value="years">Years</option>
                </select>
            </div>

            <input type="number" placeholder="Start Day" class="fieldStart w-90" value="0" />
            <button class="delete-btn">Delete</button>
        </div>
    </template>

    <template id="template-once">
        <div class="row">
            <input type="text" placeholder="Name (e.g. Bonus)" class="fieldName" oninput="updateSummary(this)" />
            <input type="number" placeholder="Value" class="fieldVal" />
            <input type="number" placeholder="On Day" class="fieldDay w-90" value="0" />
            <button class="delete-btn">Delete</button>
        </div>
    </template>

    <template id="template-loan">
        <div class="row">
            <input type="text" placeholder="Loan Name" class="fieldName" oninput="updateSummary(this)" />
            <input type="number" placeholder="Principal" class="fieldPrincipal" />
            <input type="number" placeholder="Rate (%)" class="fieldRate" step="0.01" />
            <select class="fieldRateUnit w-85">
                <option value="monthly" selected>Monthly</option>
                <option value="yearly">Yearly</option>
            </select>
            <input type="number" placeholder="Payment" class="fieldPayment" />

            <div class="inline-group">
                <span class="inline-label">Every</span>
                <input type="number" class="fieldPayFreqNum w-45" value="1" min="1" />
                <select class="fieldPayFreqUnit w-85">
                    <option value="days">Days</option>
                    <option value="weeks">Weeks</option>
                    <option value="months" selected>Months</option>
                    <option value="years">Years</option>
                </select>
            </div>

            <input type="number" placeholder="Start Day" class="fieldStart w-80" value="0" />
            <button class="delete-btn">Delete</button>
        </div>
    </template>

    <script defer src="scripts/inputs.js"></script>
    <script defer src="scripts/ports.js"></script>
</body>
</html>
